name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile check
        run: python -m compileall -q backend/app backend/tests
      - name: Check landing page script
        run: node --check frontend/landing/landing.js
      - name: Build static output
        run: python backend/scripts/prepare_static.py
      - name: Check static output is in sync
        run: git diff --exit-code -- frontend/public/
      - name: Run tests
        run: python -m pytest backend/tests -q
